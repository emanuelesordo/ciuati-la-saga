ight:1.45}.tile:hover{border-color:#e0ba74}.section-title{font-family:Georgia,serif;color:#e6c78f;margin:28px 0 14px}.tabs{display:flex;overflow:auto;gap:8px;padding:9px 0 13px;scrollbar-width:none}.tab{border:1px solid #7b6345;border-radius:999px;white-space:nowrap;padding:10px 13px;font-size:.83rem}.tab.active{background:#d2a45c;color:#211619;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;background:#201920f5;border-top:1px solid #756044;padding:7px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav a{font-size:.7rem;text-align:center;flex:1;display:grid;gap:3px;color:#d1bda3;padding:3px 0}.nav a span{font-size:1.35rem}.nav .active{color:#f4d18c;font-weight:bold}.action{display:inline-block;margin:6px 7px 6px 0}.notice{border-left:3px solid #d9b779;background:#30292b;padding:13px;margin:15px 0;line-height:1.5}.error{border-left-color:#e07b79}.empty{padding:18px;color:#bcae99}.profile{display:flex;gap:18px;align-items:center}.portrait{width:80px;height:80px;flex:none;border:1px solid #95764c;border-radius:14px;display:grid;place-items:center;background:#45332c;font:2rem Georgia,serif;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.profile h3{margin:0 0 6px}.profile p{margin:0}.detail-copy{white-space:pre-wrap;line-height:1.65;color:#e5d3b9;overflow-wrap:anywhere}.form-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modal-mask{position:fixed;inset:0;z-index:50;background:#070509dd;display:grid;place-items:center;padding:16px}.modal{width:min(100%,440px);max-height:90svh;overflow:auto;background:#292029;border:1px solid #ad8554;border-radius:16px;padding:21px}.login-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.login-grid button{min-height:90px;font-family:Georgia,serif;font-size:1.1rem}.status{font-size:.85rem;color:#debb82}.panel p{line-height:1.6}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax( </style></head><body><div id="app" class="shell"><p>Caricamento della Saga…</p></div><nav id="nav" class="nav" aria-label="Navigazione principale"></nav>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
const sb=createClient("https://oiqredpxzkqvikvhapwb.supabase.co","sb_publishable_BJWmbZMArDeF-Z7exIdmHQ_45GNQxRC",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const main=document.getElementById("app"),nav=document.getElementById("nav");
const cast=[["scema","Viper","Custode degli antichi inverni"],["cece","Cecè","Membro della Cerchia"],["hermano","Hermano","Membro della Cerchia"],["barretta","Barretta","Maestro delle disamine"],["giogale","Giogale","Membro della Cerchia"],["le-fromage","Le Fromage","Un enigma nella chioma"]];

function render(){
if(active==="home"){shell('<section class="hero"><div class="kicker">UN MONDO DI LEGGENDE IMPROBABILI</div><h1>CIUATI <span>LA SAGA</span></h1><p class="lead">Sei destini, una Cerchia e una leggenda in continua evoluzione. Ogni contributo può influenzare le prossime cronache.</p>'+a("Entra nella Saga","cronache")+a("Scopri la Cerchia","archivio")+'</section><h2 class="section-title">Scegli il tuo percorso</h2><div class="grid">'+tile("La Cerchia","I sei protagonisti","archivio/ciuati")+tile("Antagonisti","Rivali, fazioni e segreti","archivio/antagonisti")+tile("Altri personaggi","Alleati e figure misteriose","archivio/altri")+tile("Le Cronache","Episodi approvati","cronache")+tile("Atlante","Le terre della Saga","luoghi")+tile("Alimenta la storia","Contributi e proposte","contributi")+'</div><section class="panel"><div class="kicker">DALLE CRONACHE</div><h2>Il richiamo dell’Auronerum</h2><p>Una congregazione giallonera, la sua misteriosa Casta e una rivalità che si decide anche sul campo.</p></section>');return;}
if(active==="archivio"){const tab=target||"ciuati",items=tab==="ciuati"?characters:secondary.filter(s=>role(s)===tab);shell(head("Archivio dei personaggi","Consulta liberamente le schede. Le informazioni emergono gradualmente nella storia.")+'<div class="tabs">'+[["ciuati","I Ciuati"],["antagonisti","Antagonisti"],["altri","Altri personaggi"]].map(([id,title])=>a(title,"archivio/"+id,"tab"+(tab===id?" active":""))).join("")+'</div><div class="grid">'+items.map(c=>tile(c.display_name,c.biography||c.description||"Scopri il personaggio","scheda/"+(tab==="ciuati"?"p":"s")+"/"+encodeURIComponent(c.slug))).join("")+'</div>'+(!items.length?'<p class="empty">Nessuna scheda pubblicata per questa categoria.</p>':""));return;}
if(active==="scheda"){const sec=target==="s",slug=decodeURIComponent((location.hash.split("/")[2]||"")),c=(sec?secondary:characters).find(x=>x.slug===slug);if(!c){shell(head("Scheda non disponibile")+a("Torna all’archivio","archivio"));return;}shell(a("← Archivio","archivio", "tab")+head(c.display_name)+ '<section class="panel"><div class="profile">'+avatar(c.avatar_path,c.display_name)+'<div><h3>'+e(c.display_name)+'</h3><p class="muted">'+e(sec?c.narrative_role||"Personaggio della Saga":"Membro della Cerchia")+'</p></div></div><p class="detail-copy">'+e(c.biography||c.description||"Un'identità ancora avvolta nel mistero.")+'</p></section>'+(!isCiuato()?'<section class="panel">Per contribuire alla scheda devi accedere come Ciuato. '+a("Accedi","login")+'</section>':a("Aggiungi un contributo a questa scheda","contributi/"+(sec?"s":"p")+"/"+encodeURIComponent(c.slug))) );return;}
if(active==="luoghi"){shell(head("Atlante della Saga","Terre, roccaforti, luoghi di ritrovo e campi di battaglia.")+'<div class="grid">'+places.map(p=>'<article class="tile"><b>'+e(p.name)+'</b><small>'+e(p.description)+'</small></article>').join("")+'</div>'+(!places.length?'<p class="empty">Nessun luogo pubblicato.</p>':""));return;}
if(active==="cronache"){shell(head("Le Cronache","Solo gli episodi approvati e pubblicati sono visibili ai lettori.")+'<div class="grid">'+episodes.map(p=>tile(p.title,p.summary||"Episodio","episodio/"+p.id)).join("")+'</div>'+(!episodes.length?'<section class="panel"><h2>La leggenda è in preparazione</h2><p>Non ci sono ancora episodi pubblicati. Le bozze rimangono nel laboratorio dell’amministratore.</p></section>':""));return;}
if(active==="episodio"){const p=episodes.find(x=>x.id===target);shell(a("← Cronache","cronache","tab")+head(p?.title||"Episodio")+ (p?'<section class="panel"><p>'+e(p.summary)+'</p><div class="detail-copy">'+e(Array.isArray(p.content)?p.content.map(x=>typeof x==="string"?x:JSON.stringify(x)).join("\n\n"):typeof p.content==="string"?p.content:JSON.stringify(p.content||""))+'</div></section>':"<p>Episodio non disponibile.</p>"));return;}
if(active==="login"){shell(head("Chi sei, Ciuatu?","Scegli il tuo personaggio. La password si inserisce nella finestra successiva.")+'<div class="login-grid">'+[...cast.map(c=>[c[0],c[1]]),["admin","Admin"]].map(c=>'<button type="button" data-login="'+e(c[0])+'">'+e(c[1])+'</button>').join("")+'</div>');document.querySelectorAll("[data-login]").forEach(x=>x.onclick=()=>loginModal(x.dataset.login));return;}
if(active==="contributi"){if(!isCiuato()){shell(head("Alimenta la Saga","Solo i sei Ciuati e l’amministratore possono inviare contributi.")+a("Accedi","login"));return;}
const detail=location.hash.split("/"),scoped=detail[1]==="p"||detail[1]==="s", c=scoped?(detail[1]==="s"?secondary:characters).find(x=>x.slug===decodeURIComponent(detail[2]||"")):null;
shell(head(scoped?"Contributo per "+(c?.display_name||"personaggio"):"Contribuisci alla leggenda",scoped?"Questa testimonianza resta collegata esclusivamente alla scheda scelta.":"Qui puoi proporre liberamente sviluppi della storia e nuovi personaggi.")+'<section class="panel"><form id="contrib-form"><label for="kind">Tipo di contributo</label><select id="kind">'+(scoped?[["perception","Percezione"],["relationship","Relazione"],["skill","Abilità"],["weakness","Debolezza"],["ideology","Ideologia"]]:[["story","Spunto per la trama"],["character_proposal","Proposta di personaggio"],["perception","Percezione generale"],["relationship","Relazione"]]).map(k=>'<option value="'+k[0]+'">'+k[1]+'</option>').join("")+'</select><label for="content">La tua testimonianza</label><textarea id="content" required minlength="10" maxlength="6000" placeholder="Racconta il tuo contributo…"></textarea><button type="submit">Invia al narratore</button></form><p class="muted">Il contributo viene conservato come bozza da esaminare. Non viene pubblicato automaticamente.</p></section>');document.getElementById("contrib-form").onsubmit=ev=>saveContribution(ev,c,detail[1]);return;}
if(active==="admin"){if(!isAdmin()){shell(head("Accesso riservato")+a("Accedi come amministratore","login"));return;}shell(head("Laboratorio del Narratore","Revisione dei contributi e preparazione degli episodi.")+'<div class="tabs">'+a("Contributi","admin")+a("Nuovo episodio","nuovo-episodio")+a("Archivio","archivio")+'</div><div id="admin-queue" class="panel">Caricamento contributi…</div>');void loadQueue();return;}

shell(head("Pagina non trovata")+a("Torna alla Home","home"));
}
async function loginModal(slug){const name=slug==="admin"?"Amministratore":cast.find(c=>c[0]===slug)?.[1]||slug;const mask=document.createElement("div");mask.className="modal-mask";mask.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-label="Accesso"><button id="close" type="button">← Cambia personaggio</button><h2>'+e(name)+'</h2><form id="login-form"><label>Password<input id="pass" type="password" minlength="8" autocomplete="current-password" required></label><div id="first-fields" hidden><label>Codice di sblocco<input id="code" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label><label>Conferma password<input id="confirm" type="password" minlength="8"></label></div><button id="login-submit" type="submit">Accedi</button></form>'+(slug==="admin"?"":'<button id="toggle-first" type="button">Primo accesso? Imposta password</button>')+'<p id="login-status" role="status" class="status"></p></section>';document.body.append(mask);mask.querySelector("#close").onclick=()=>mask.remove();mask.onclick=ev=>{if(ev.target===mask)mask.remove();};let first=false;const toggle=mask.querySelector("#toggle-first");if(toggle)toggle.onclick=()=>{first=!first;mask.querySelector("#first-fields").hidden=!first;mask.querySelector("#login-submit").textContent=first?"Attiva personaggio":"Accedi";toggle.textContent=first?"Hai già una password? Accedi":"Primo accesso? Imposta password";};mask.querySelector("#login-form").onsubmit=async ev=>{ev.preventDefault();const password=mask.querySelector("#pass").value,notice=mask.querySelector("#login-status");notice.textContent="Verifica in corso…";const submit=mask.querySelector("#login-submit");submit.disabled=true;try{if(first){if(mask.querySelector("#confirm").value!==password)throw Error("Le password non coincidono.");const code=mask.querySelector("#code").value;if(!/^\d{4}$/.test(code))throw Error("Codice di sblocco non valido.");const r=await sb.functions.invoke("register-character",{body:{slug,password,code}});if(r.error)throw Error("Attivazione non riuscita: "+r.error.message);if(!r.data?.ok)throw Error(r.data?.error||"Attivazione non riuscita.");}const {data,error}=await sb.auth.signInWithPassword({email:(slug==="admin"?"admin":slug)+"@ciuati.invalid",password});if(error)throw error;const metadata=data.user?.app_metadata||{};if(slug==="admin"?metadata.role!=="admin":metadata.character_slug!==slug){await sb.auth.signOut();throw Error("L’account non è associato al personaggio selezionato.");}user=data.user;mask.remove();location.hash=slug==="admin"?"admin":"archivio/ciuati";await refresh();}catch(ex){notice.textContent=ex.message||"Accesso non riuscito.";}finally{submit.disabled=false;}};mask.querySelector("#pass").focus();}
async function saveContribution(ev,c,kind){ev.preventDefault();const form=ev.currentTarget,button=form.querySelector("button");button.disabled=true;try{const {data:{user:real}}=await sb.auth.getUser();if(!real||!(real.app_metadata?.role==="admin"||cast.some(x=>x[0]===real.app_metadata?.character_slug)))throw Error("Sessione non autorizzata.");const author=characters.find(x=>x.slug===real.app_metadata?.character_slug);const entry={author_id:real.id,character_id:author?.id||null,target_character_id:kind==="p"?c?.id:null,kind:document.getElementById("kind").value,content:document.getElementById("content").value.trim(),status:"pending",mentions:kind==="s"&&c?[{type:"secondary_character",id:c.id,name:c.display_name}]:[],proposal:{}};const {error}=await sb.from("narrative_inputs").insert(entry);if(error)throw error;form.reset();msg("Contributo salvato in Supabase e in attesa di revisione.");}catch(ex){msg(ex.message,true);}finally{button.disabled=false;}}
async function loadQueue(){const host=document.getElementById("admin-queue");if(!host)return;const {data,error}=await sb.from("narrative_inputs").select("id,content,kind,status,created_at").order("created_at",{ascending:false}).limit(50);if(error){host.textContent="Impossibile caricare: "+error.message;return;}host.innerHTML='<h2>Contributi ricevuti</h2>'+(!data.length?'<p>Nessun contributo.</p>':data.map(i=>'<article class="panel"><small>'+e(i.kind)+" · "+e(i.status)+'</small><p class="detail-copy">'+e(i.content)+'</p>'+(i.status==="pending"?'<button data-decision="accepted" data-id="'+e(i.id)+'">Accetta</button> <button data-decision="rejected" data-id="'+e(i.id)+'">Rifiuta</button>':"")+'</article>').join(""));host.querySelectorAll("[data-decision]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from("narrative_inputs").update({status:b.dataset.decision}).eq("id",b.dataset.id);if(error)msg(error.message,true);else{msg("Revisione salvata.");void loadQueue();}b.disabled=false;});}
async function saveEpisode(ev){ev.preventDefault();const form=ev.currentTarget,button=form.querySelector("button");button.disabled=true;try{const {data:{user:real}}=await sb.auth.getUser();if(real?.app_metadata?.role!=="admin")throw Error("Admin non autorizzato.");const {error}=await sb.from("episodes").insert({title:document.getElementById("ep-title").value.trim(),summary:document.getElementById("ep-summary").value.trim(),content:[document.getElementById("ep-body").value.trim()],is_published:false});if(error)throw error;form.reset();msg("Episodio salvato come bozza privata. Nessuna pubblicazione automatica.");}catch(ex){msg(ex.message,true);}finally{button.disabled=false;}}
async function refresh(){const out=await Promise.all([sb.from("characters").select("id,slug,display_name,biography,avatar_path,is_published").eq("is_published",true).order("display_name"),sb.from("secondary_characters").select("id,slug,display_name,description,narrative_role,avatar_path").eq("is_published",true).order("display_name"),sb.from("saga_places").select("id,slug,name,description").eq("is_published",true).order("name"),sb.from("episodes").select("id,title,summary,content,published_at").eq("is_published",true).order("published_at",{ascending:false})]);characters=out[0].data||[];secondary=out[1].data||[];places=out[2].data||[];episodes=out[3].data||[];render();if(out.some(x=>x.error))msg("Alcuni archivi non sono disponibili: "+out.filter(x=>x.error).map(x=>x.error.message).join("; "),true);}
window.addEventListener("hashchange",route);sb.auth.onAuthStateChange((_,session)=>{user=session?.user||null;render();});async function init(){const {data:{user:u}}=await sb.auth.getUser();user=u;await refresh();route();}init().catch(ex=>{main.textContent="Connessione non disponibile: "+ex.message;});
</script></body></html>
