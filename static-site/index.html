async function loginModal(slug){const name=slug==="admin"?"Amministratore":cast.find(c=>c[0]===slug)?.[1]||slug;const mask=document.createElement("div");mask.className="modal-mask";mask.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-label="Accesso"><button id="close" type="button">← Cambia personaggio</button><h2>'+e(name)+'</h2><form id="login-form"><label>Password<input id="pass" type="password" minlength="8" autocomplete="current-password" required></label><div id="first-fields" hidden><label>Codice di sblocco<input id="code" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label><label>Conferma password<input id="confirm" type="password" minlength="8"></label></div><button id="login-submit" type="submit">Accedi</button></form>'+(slug==="admin"?"":'<button id="toggle-first" type="button">Primo accesso? Imposta password</button>')+'<p id="login-status" role="status" class="status"></p></section>';document.body.append(mask);mask.querySelector("#close").onclick=()=>mask.remove();mask.onclick=ev=>{if(ev.target===mask)mask.remove();};let first=false;const toggle=mask.querySelector("#toggle-first");if(toggle)toggle.onclick=()=>{first=!first;mask.querySelector("#first-fields").hidden=!first;mask.querySelector("#login-submit").textContent=first?"Attiva personaggio":"Accedi";toggle.textContent=first?"Hai già una password? Accedi":"Primo accesso? Imposta password";};mask.querySelector("#login-form").onsubmit=async ev=>{ev.preventDefault();const password=mask.querySelector("#pass").value,notice=mask.querySelector("#login-status");notice.textContent="Verifica in corso…";const submit=mask.querySelector("#login-submit");submit.disabled=true;try{if(first){if(mask.querySelector("#confirm").value!==password)throw Error("Le password non coincidono.");const code=mask.querySelector("#code").value;if(!/^\d{4}$/.test(code))throw Error("Codice di sblocco non valido.");const r=await sb.functions.invoke("register-character",{body:{slug,password,code}});if(r.error)throw Error("Attivazione non riuscita: "+r.error.message);if(!r.data?.ok)throw Error(r.data?.error||"Attivazione non riuscita.");}const {data,error}=await sb.auth.signInWithPassword({email:(slug==="admin"?"admin":slug)+"@ciuati.invalid",password});if(error)throw error;const metadata=data.user?.app_metadata||{};if(slug==="admin"?metadata.role!=="admin":metadata.character_slug!==slug){await sb.auth.signOut();throw Error("L’account non è associato al personaggio selezionato.");}user=data.user;mask.remove();location.hash=slug==="admin"?"admin":"archivio/ciuati";await refresh();}catch(ex){notice.textContent=ex.message||"Accesso non riuscito.";}finally{submit.disabled=false;}};mask.querySelector("#pass").focus();}
async function saveContribution(ev,c,kind){ev.preventDefault();const form=ev.currentTarget,button=form.querySelector("button");button.disabled=true;try{const {data:{user:real}}=await sb.auth.getUser();if(!real||!(real.app_metadata?.role==="admin"||cast.some(x=>x[0]===real.app_metadata?.character_slug)))throw Error("Sessione non autorizzata.");const author=characters.find(x=>x.slug===real.app_metadata?.character_slug);const entry={author_id:real.id,character_id:author?.id||null,target_character_id:kind==="p"?c?.id:null,kind:document.getElementById("kind").value,content:document.getElementById("content").value.trim(),status:"accepted",mentions:kind==="s"&&c?[{type:"secondary_character",id:c.id,name:c.display_name}]:[],proposal:{}};const {error}=await sb.from("narrative_inputs").insert(entry);if(error)throw error;form.reset();msg("Contributo registrato nella memoria narrativa, con autore e tipologia. L’IA ne valuterà attendibilità e coerenza.");}catch(ex){msg(ex.message,true);}finally{button.disabled=false;}}
async function loadQueue(){const host=document.getElementById("admin-queue");if(!host)return;const {data,error}=await sb.from("narrative_inputs").select("id,content,kind,status,created_at").order("created_at",{ascending:false}).limit(50);if(error){host.textContent="Impossibile caricare: "+error.message;return;}host.innerHTML='<h2>Contributi ricevuti</h2>'+(!data.length?'<p>Nessun contributo.</p>':data.map(i=>'<article class="panel"><small>'+e(i.kind)+" · "+e(i.status)+'</small><p class="detail-copy">'+e(i.content)+'</p>'+(i.status==="pending"?'<button data-decision="accepted" data-id="'+e(i.id)+'">Accetta</button> <button data-decision="rejected" data-id="'+e(i.id)+'">Rifiuta</button>':"")+'</article>').join(""));host.querySelectorAll("[data-decision]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from("narrative_inputs").update({status:b.dataset.decision}).eq("id",b.dataset.id);if(error)msg(error.message,true);else{msg("Revisione salvata.");void loadQueue();}b.disabled=false;});}
async function loadEpisodePlan(){const node=document.getElementById("episode-plan"),select=document.getElementById("ai-episode"),button=document.getElementById("ai-generate");if(!node||!select||!button)return;try{const {data,error}=await sb.functions.invoke("saga-narratore",{body:{action:"plan"}});if(error||!data?.ok)throw Error(data?.error||error?.message||"Piano non accessibile");const plan=data.plan||[];const pending=plan.find(p=>p.status!=="approved");const unlocked=pending?.status==="planned";select.innerHTML=unlocked?'<option value="'+e(pending.id)+'">Capitolo '+pending.number+' — '+e(pending.title)+'</option>':'<option value="">'+(pending?.status==="draft"?"Revisiona prima la bozza del capitolo "+pending.number:"Tutti i capitoli sono già approvati")+'</option>';select.disabled=!unlocked;button.disabled=!unlocked;node.innerHTML=plan.map(p=>'<article class="panel" style="margin:9px 0;padding:13px"><small>'+e(p.period)+' · Capitolo '+p.number+' · '+(p.status==="approved"?"Approvato":p.status==="draft"?"Bozza da revisionare":p.id===pending?.id?"Prossimo":"Programmato")+'</small><h3 style="margin:6px 0">'+e(p.title)+'</h3><p class="muted" style="margin:5px 0">'+e(p.focus)+'</p></article>').join("");}catch(err){node.textContent="Impossibile caricare il piano cronologico: "+(err?.message||"errore");select.disabled=true;button.disabled=true;}}
async function loadDrafts(){const node=document.getElementById("draft-list");if(!node)return;const {data,error}=await sb.from("narrative_runs").select("id,title,summary,body,status,continuity_notes,context_snapshot,created_at").order("created_at",{ascending:false}).limit(35);if(error){node.textContent=error.message;return;}node.innerHTML=(data.length?data.map(d=>'<article class="panel"><small>'+e(d.status)+(d.context_snapshot?.episode_number?' · Capitolo '+d.context_snapshot.episode_number:'')+'</small><h3>'+e(d.title)+'</h3><p>'+e(d.summary)+'</p><details><summary>Testo e note di continuità</summary><p class="detail-copy">'+e(d.body)+'</p><p>'+e((d.continuity_notes||[]).join("; "))+'</p></details>'+'<div class="draft-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" data-copy="'+e(d.id)+'">Copia</button>'+(d.status==="draft"?'<button type="button" data-edit="'+e(d.id)+'">Modifica</button>':'')+(d.status==="draft"?'<button type="button" data-regenerate="'+e(d.id)+'">Rigenera</button> <button data-approve="'+e(d.id)+'">Approva e pubblica</button> <button data-reject="'+e(d.id)+'">Scarta</button>':d.status==="rejected"?'<button type="button" data-delete="'+e(d.id)+'">Elimina definitivamente</button>':'')+'</div>'+'</article>').join(""):'<p>Nessuna bozza disponibile.</p>');node.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const d=data.find(x=>x.id===b.dataset.copy);if(!d)return;try{await navigator.clipboard.writeText([d.title,d.summary,d.body,(d.continuity_notes||[]).join("; ")].join("\\n\\n"));msg("Proposta copiata.");}catch{msg("Copia non riuscita: autorizza gli appunti nel browser.",true);}});
node.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const d=data.find(x=>x.id===b.dataset.edit);if(!d||d.status!=="draft")return;const card=b.closest("article");if(!card)return;const existing=card.querySelector("[data-draft-editor]");if(existing){existing.remove();b.textContent="Modifica";return;}const form=document.createElement("form");form.dataset.draftEditor=d.id;form.innerHTML='<label>Titolo<input name="title" required maxlength="160" value="'+e(d.title)+'"></label><label>Riassunto<textarea name="summary" required>'+e(d.summary)+'</textarea></label><label>Trama / sceneggiatura<textarea name="body" required rows="16">'+e(d.body)+'</textarea></label><button type="submit">Salva modifiche</button> <button type="button" data-cancel>Annulla</button>';card.append(form);b.textContent="Chiudi editor";form.querySelector("[data-cancel]").onclick=()=>{form.remove();b.textContent="Modifica";};form.onsubmit=async ev=>{ev.preventDefault();const title=form.elements.namedItem("title").value.trim(),summary=form.elements.namedItem("summary").value.trim(),body=form.elements.namedItem("body").value.trim();if(!title||!summary||!body){msg("Titolo, riassunto e testo sono obbligatori.",true);return;}const submit=form.querySelector('button[type="submit"]');submit.disabled=true;try{const {data:{user:real}}=await sb.auth.getUser();if(real?.app_metadata?.role!=="admin")throw Error("Admin non autorizzato.");const {data:updated,error}=await sb.from("narrative_runs").update({title,summary,body}).eq("id",d.id).eq("status","draft").select("id");if(error)throw error;if(!updated?.length)throw Error("La bozza non è più modificabile oppure mancano i permessi.");msg("Modifiche salvate.");await loadDrafts();}catch(ex){msg(ex.message||"Salvataggio non riuscito.",true);}finally{submit.disabled=false;}};});
node.querySelectorAll("[data-regenerate]").forEach(b=>b.onclick=async()=>{const d=data.find(x=>x.id===b.dataset.regenerate);if(!d)return;if(!confirm("Rigenerare questa bozza sostituendo il testo attuale? Non verrà creata un'altra bozza."))return;b.disabled=true;try{const {data:result,error}=await sb.functions.invoke("saga-narratore",{body:{regenerateId:d.id}});if(error||!result?.ok)throw Error(result?.error||error?.message||"Rigenerazione fallita");msg("Bozza rigenerata senza creare nuovi scarti.");await loadDrafts();}catch(ex){msg(ex.message,true);}finally{b.disabled=false;}});
node.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const d=data.find(x=>x.id===b.dataset.delete);if(!d||d.status!=="rejected")return;if(!confirm('Eliminare DEFINITIVAMENTE la bozza scartata "'+d.title+'"? Operazione irreversibile.'))return;b.disabled=true;try{const {data:deleted,error}=await sb.from("narrative_runs").delete().eq("id",d.id).eq("status","rejected").select("id");if(error)throw error;if(!deleted?.length)throw Error("Bozza non eliminata: controlla i permessi Admin.");msg("Bozza eliminata definitivamente.");await loadDrafts();}catch(ex){msg(ex.message,true);}finally{b.disabled=false;}});
node.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=data.find(x=>x.id===b.dataset.approve);if(!d)throw Error("Bozza non trovata");const {data:ep,error}=await sb.from("episodes").insert({title:d.title,summary:d.summary,content:[d.body],is_published:true,published_at:new Date().toISOString()}).select("id").single();if(error)throw error;const saved=await sb.from("narrative_runs").update({status:"approved",reviewed_at:new Date().toISOString(),published_episode_id:ep.id}).eq("id",d.id).eq("status","draft");if(saved.error)throw saved.error;await refresh();msg("Episodio pubblicato.");void loadDrafts();}catch(ex){msg(ex.message,true);}finally{b.disabled=false;}});node.querySelectorAll("[data-reject]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from("narrative_runs").update({status:"rejected",reviewed_at:new Date().toISOString()}).eq("id",b.dataset.reject).eq("status","draft");if(error)msg(error.message,true);else{msg("Bozza scartata");void loadDrafts();}b.disabled=false;});}
async function saveEpisode(ev){ev.preventDefault();const form=ev.currentTarget,button=form.querySelector("button");button.disabled=true;try{const {data:{user:real}}=await sb.auth.getUser();if(real?.app_metadata?.role!=="admin")throw Error("Admin non autorizzato.");const {error}=await sb.from("episodes").insert({title:document.getElementById("ep-title").value.trim(),summary:document.getElementById("ep-summary").value.trim(),content:[document.getElementById("ep-body").value.trim()],is_published:false});if(error)throw error;form.reset();msg("Episodio salvato come bozza privata. Nessuna pubblicazione automatica.");}catch(ex){msg(ex.message,true);}finally{button.disabled=false;}}
async function refresh(){const out=await Promise.all([sb.from("characters").select("id,slug,display_name,biography,avatar_path,is_published").eq("is_published",true).order("display_name"),sb.from("secondary_characters").select("id,slug,display_name,description,narrative_role,avatar_path").eq("is_published",true).order("display_name"),sb.from("saga_places").select("id,slug,name,description").eq("is_published",true).order("name"),sb.from("episodes").select("id,title,summary,content,published_at").eq("is_published",true).order("published_at",{ascending:false})]);characters=out[0].data||[];secondary=out[1].data||[];places=out[2].data||[];episodes=out[3].data||[];render();if(out.some(x=>x.error))msg("Alcuni archivi non sono disponibili: "+out.filter(x=>x.error).map(x=>x.error.message).join("; "),true);}

  const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm");

  const {data:{user:u}}=await sb.auth.getUser();user=u;

 }catch(ex){
