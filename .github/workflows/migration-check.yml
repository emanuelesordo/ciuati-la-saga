name: Verify Next.js application
on:
  push:
    branches: [migrazione/github-hosting]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'pages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - '.github/workflows/migration-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
