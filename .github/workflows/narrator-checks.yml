name: Narrator checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chat import, search and similarity
        run: node --experimental-strip-types scripts/verify-narrative-dialogues.mjs
      - name: Install pinned project dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npx tsc --noEmit
