name: Deploy static Saga to GitHub Pages
on:
  push:
    branches: [migrazione/github-hosting]
    paths:
      - 'static-site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
