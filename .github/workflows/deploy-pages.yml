name: Deploy static Saga to GitHub Pages
on:
  push:
    branches: [migrazione/github-hosting]
    paths:
      - 'static-site/**'
      - 'supabase/functions/saga-narratore/**'
      - 'scripts/verify-narrative-dialogues.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-saga
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate static entrypoint
        shell: bash
        run: |
          test -s static-site/index.html
          grep -q '<html' static-site/index.html
          grep -q 'ENTRA NELLA SAGA' static-site/index.html
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify narrator dialogue import and static site
        run: node scripts/verify-narrative-dialogues.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static-site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
